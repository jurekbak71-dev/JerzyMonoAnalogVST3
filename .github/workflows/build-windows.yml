name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [Instrument, FX]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        shell: pwsh
        run: |
          if ("${{ matrix.variant }}" -eq "FX") {
            cmake --build build --config Release --target JerzyMonoAnalogFX_VST3 --parallel
          } else {
            cmake --build build --config Release --target JerzyMonoAnalog_VST3 MonoDSPTests MonoParaphonicTests MonoProcessorTests MonoExpansionTests MonoRoutingTests --parallel
          }
      - name: DSP and routing regression tests
        if: matrix.variant == 'Instrument'
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Locate and package VST3
        shell: pwsh
        run: |
          $name = if ("${{ matrix.variant }}" -eq "FX") { "Jerzy Mono Analog Grid FX.vst3" } else { "Jerzy Mono Analog Grid.vst3" }
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter $name | Select-Object -First 1
          if (-not $plugin) { throw "Missing VST3: $name" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse -Force $plugin.FullName "artifact/$name"
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Jerzy-Mono-Analog-Grid-Windows-${{ matrix.variant }}-VST3
          path: artifact/
          if-no-files-found: error
          retention-days: 90
